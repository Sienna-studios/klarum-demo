<body>

<div style="position: absolute; left: 984px; top: 196px; width: 408px; display: flex; flex-direction: column; align-items: flex-start">

<script type="text/x-dc" data-dc-script data-props='{"hatchShare":{"editor":"range","default":0.6,"min":0,"max":1,"step":0.05},"$preview":{"width":1440,"height":874}}'>
class Component extends DCLogic {
renderVals() {
const share = this.props.hatchShare ?? 0.6;
const hash = (i, j, s) => { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + s) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const sm = (t) => t * t * (3 - 2 * t);
const noise = (x, y, sc, s) => { const u = x / sc, v = y / sc, i = Math.floor(u), j = Math.floor(v), fu = sm(u - i), fv = sm(v - j); return (hash(i, j, s) * (1 - fu) + hash(i + 1, j, s) * fu) * (1 - fv) + (hash(i, j + 1, s) * (1 - fu) + hash(i + 1, j + 1, s) * fu) * fv; };
// Like today's mosaic: dense along the top and the outer edges, thinning toward the city's centre.
// Road, bridge traffic and old-town facades stay clear; the copy sits on its own island.
const protect = [[350, 450, 962, 612], [0, 312, 732, 412], [0, 150, 662, 312]];
const hits = (x, y) => protect.some((r) => x < r[2] && x + 48 > r[0] && y < r[3] && y + 48 > r[1]);
const cells = [];
for (let r = 0; r < 17; r++) for (let c = 0; c < 30; c++) {
const x = c * 48, y = r * 48, cx = x + 24, cy = y + 24;
const edge = Math.min(cy / 810 * 2.2, Math.min(cx, 1440 - cx) / 1440 * 3.2, (810 - cy) / 810 * 3);
const v = noise(cx, cy, 140, 7) * 0.7 + hash(c, r, 3) * 0.3 - edge * 0.55;
if (v < 0.22 || hits(x, y)) continue;
cells.push({ x, y, k: hash(c, r, 11) < share ? 'hatch' : 'solid' });
}
let a = 41;
const rnd = () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; };
const island = [];
for (let r = -1; r <= 11; r++) for (let c = -1; c <= 10; c++) {
const x = 936 + c * 48, y = 144 + r * 48;
const inBase = r >= 0 && r < 11 && c >= 0 && c < 10;
const core = x < 1404 && x + 48 > 970 && y < 640 && y + 48 > 186;
const edge = inBase && (r === 0 || r === 10 || c === 0 || c === 9);
if (core || (inBase && !edge) || (edge && rnd() > 0.32) || (!inBase && rnd() < 0.12)) island.push({ x, y });
}
return { cells, island };
}
}
</script>
