<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Package 3: one tender, party wiring</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#b9bfc2;text-decoration:none}a:hover{color:#f3f2ec}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
.party{display:grid;grid-template-columns:28px 1fr;column-gap:12px;width:100%;padding:12px 0;border:0;border-top:1px solid #2a343c;background:transparent;font:inherit;color:#f3f2ec;text-align:left;cursor:pointer;transition:opacity .25s}
.party:focus-visible{outline:2px solid #ef4136;outline-offset:2px}
.all{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px;border:0;background:#ef4136;font:600 15px/1 'IBM Plex Sans',sans-serif;color:#141b21;cursor:pointer}
.all:hover{background:#f3f2ec}
.term{position:absolute;width:180px;height:56px;box-sizing:border-box;padding:8px 12px;border:1.5px solid #f3f2ec;background:#141b21;transition:opacity .25s,border-color .25s}
.wire{transition:stroke-dashoffset .38s cubic-bezier(.4,0,.2,1),opacity .3s}
.wl{position:absolute;margin:0;padding:2px 6px;background:#141b21;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#ef4136;white-space:nowrap;transition:opacity .25s}
</style>
</helmet>
<div style="width: 1440px; height: 874px; background: #141b21; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #f3f2ec; overflow: hidden">
<header style="height: 64px; box-sizing: border-box; padding: 0 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid #2a343c">
<img src="../../assets/f7bec00e914435d1ef69a6793858ef3c.svg" alt="Klarum" style="height: 24px; width: auto; display: block; filter: invert(1) brightness(0.96)">
<nav aria-label="Main" style="display: flex; gap: 32px; font-size: 13.5px"><a href="#">Notices</a><a href="#">Pricing</a><a href="#">Articles</a></nav>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 18px; font-size: 13px"><span class="mono" style="font-size: 12px; letter-spacing: 0">EN</span><a href="#">sign in</a><a href="#" style="padding: 9px 16px; background: #ef4136; color: #141b21; font-weight: 600">Start free</a></div>
</header>
<section aria-labelledby="wire-h" style="position: relative; height: 810px">
<div style="position: absolute; left: 64px; top: 56px; width: 360px">
<p class="mono" style="margin: 0; font-size: 12px; color: #ef4136">Who a tender touches</p>
<h2 id="wire-h" style="margin: 16px 0 0; font-size: 46px; font-weight: 400; line-height: 50px; letter-spacing: -0.04em">One tender,<br>five flows.</h2>
<ul style="margin: 32px 0 0; padding: 0; list-style: none; border-bottom: 1px solid #2a343c">
<sc-for list="{{parties}}" as="p" hint-placeholder-count="5">
<li><button type="button" class="party" aria-pressed="{{p.on}}" onMouseEnter="{{p.hot}}" onFocus="{{p.hot}}" onClick="{{p.hot}}" style="opacity: {{p.op}}">
<span aria-hidden="true" class="mono" style="padding-top: 3px; font-size: 11px; color: #ef4136">{{p.k}}</span>
<span><span style="display: block; font-size: 17px; font-weight: 500">{{p.name}}</span><span style="display: block; margin-top: 2px; font-size: 14px; color: #b9bfc2">{{p.flow}}</span></span>
</button></li>
</sc-for>
</ul>
<button type="button" class="all" aria-pressed="{{allOn}}" onClick="{{showAll}}" style="margin-top: 22px">Show every flow</button>
</div>
<svg aria-hidden="true" width="1440" height="810" viewBox="0 0 1440 810" fill="none" style="position: absolute; left: 0; top: 0; pointer-events: none">
<path class="wire" d="M920 146V390" stroke="#ef4136" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="{{w0.off}}" style="opacity: {{w0.o}}; transition-delay: {{w0.dl}}s"></path>
<path class="wire" d="M680 278H760V410H820" stroke="#ef4136" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="{{w1.off}}" style="opacity: {{w1.o}}; transition-delay: {{w1.dl}}s"></path>
<path class="wire" d="M680 608H760V450H820" stroke="#ef4136" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="{{w2.off}}" style="opacity: {{w2.o}}; transition-delay: {{w2.dl}}s"></path>
<path class="wire" d="M1180 278H1080V410H1020" stroke="#ef4136" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="{{w3.off}}" style="opacity: {{w3.o}}; transition-delay: {{w3.dl}}s"></path>
<path class="wire" d="M1180 608H1080V450H1020" stroke="#ef4136" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="{{w4.off}}" style="opacity: {{w4.o}}; transition-delay: {{w4.dl}}s"></path>
<path d="M920 146V390M680 278H760V410H820M680 608H760V450H820M1180 278H1080V410H1020M1180 608H1080V450H1020" stroke="#3a454d" stroke-width="1" stroke-dasharray="3 5"></path>
<path d="M500 720H1360" stroke="#ef4136" stroke-width="6" style="opacity: {{busO}}; transition: opacity 0.4s {{busDl}}s"></path>
<path d="M920 470V720" stroke="#ef4136" stroke-width="2" style="opacity: {{busO}}; transition: opacity 0.4s {{busDl}}s"></path>
</svg>
<sc-for list="{{terms}}" as="t" hint-placeholder-count="5">
<div class="term" aria-hidden="true" style="left: {{t.x}}px; top: {{t.y}}px; opacity: {{t.op}}; border-color: {{t.bc}}">
<p class="mono" style="margin: 0; font-size: 10px; color: #b9bfc2">{{t.k}}</p>
<p style="margin: 3px 0 0; font-size: 15px; font-weight: 500">{{t.name}}</p>
<i style="position: absolute; left: {{t.px}}px; top: {{t.py}}px; width: 8px; height: 8px; background: {{t.bc}}"></i>
</div>
</sc-for>
<sc-for list="{{labels}}" as="l" hint-placeholder-count="5">
<p class="wl" aria-hidden="true" style="left: {{l.x}}px; top: {{l.y}}px; opacity: {{l.o}}">{{l.t}}</p>
</sc-for>
<div aria-hidden="true" style="position: absolute; left: 820px; top: 390px; width: 200px; height: 80px; box-sizing: border-box; padding: 10px 14px; background: #f3f2ec; color: #141b21">
<p class="mono" style="margin: 0; font-size: 10px; color: #d42a1f">Tender</p>
<p style="margin: 4px 0 0; font-size: 15px; font-weight: 600; line-height: 19px">Bridge deck<br>rehabilitation</p>
<i style="position: absolute; right: 10px; top: 10px; width: 22px; height: 22px; box-sizing: border-box; border: 1.5px solid #141b21; display: grid; place-items: center; font: 600 11px/1 'IBM Plex Mono', monospace; font-style: normal">K</i>
</div>
<p class="mono" aria-hidden="true" style="position: absolute; left: 1004px; top: 692px; margin: 0; padding: 3px 8px; background: #ef4136; color: #141b21; font-size: 11px; opacity: {{busO}}; transition: opacity 0.4s {{busDl}}s">One shared record in Klarum</p>
<p class="mono" style="position: absolute; left: 500px; top: 760px; margin: 0; font-size: 11px; color: #b9bfc2">Hover, focus or tap a party to route its flow · the list is the accessible version of the drawing</p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":874}}'>
class Component extends DCLogic {
// Party wiring, scoped to the bid team's real view: one tender in the middle and the five document flows around it.
// The list drives the schematic, so keyboard and screen-reader users get the same content without the drawing.
renderVals() {
const s = this.state || {};
const all = !!s.all;
const a = all ? -1 : (s.a ?? 1);
const P = [
['01', 'Buyer', 'Tender documents · clarifications', 830, 90, 86, 50, 930, 250],
['02', 'Subcontractors', 'Package quotes · scope splits', 500, 250, 176, 24, 500, 316],
['03', 'Consultants', 'Design input · calculations', 500, 580, 176, 24, 500, 552],
['04', 'Suppliers', 'Material prices · certificates', 1180, 250, -4, 24, 1130, 316],
['05', 'Your bid team', 'Bid package · pricing · sign-off', 1180, 580, -4, 24, 1130, 552]
];
const lit = (i) => all || i === a;
const parties = P.map(([k, name, flow], i) => ({
k, name, flow, on: lit(i) ? 'true' : 'false', op: all || i === a ? 1 : 0.5,
hot: () => this.setState({ a: i, all: false })
}));
const terms = P.map(([k, name, , x, y, px, py], i) => ({ k, name, x, y, px, py, op: lit(i) ? 1 : 0.45, bc: lit(i) ? '#ef4136' : '#f3f2ec' }));
const labels = P.map(([, , flow, , , , , lx, ly], i) => ({ t: flow, x: lx, y: ly, o: lit(i) ? 1 : 0 }));
const W = P.map((_, i) => ({ off: lit(i) ? 0 : 1, o: all ? 0.9 : 1, dl: all ? (i * 0.09).toFixed(2) : '0' }));
return {
parties, terms, labels, w0: W[0], w1: W[1], w2: W[2], w3: W[3], w4: W[4],
allOn: all ? 'true' : 'false', busO: all ? 1 : 0, busDl: all ? '0.65' : '0',
showAll: () => this.setState({ all: !all })
};
}
}
</script>
</body>
</html>
