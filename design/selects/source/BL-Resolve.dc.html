<style>

body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0D0D10;color:#fff}
a{color:inherit;text-decoration:none}

.lab{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#A9B1BA}

.pin{position:absolute;width:14px;height:14px;border-radius:50%;background:#FFE2D6;border:3px solid #0D0D10;transform:translate(-50%,-50%);box-sizing:border-box}
.card{position:absolute;box-sizing:border-box;width:244px;padding:10px 12px;background:rgba(21,22,27,.94);border:1px solid #39424C;border-radius:4px}
.card b{display:block;font-size:14px;line-height:1.3;font-weight:600}
.card i{display:flex;justify-content:space-between;align-items:center;font-style:normal;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#A9B1BA;margin-top:6px}
.fit{display:inline-flex;gap:3px;align-items:center}
.wrap{max-width:1312px;margin:0 auto;padding:0 64px;box-sizing:border-box}

.body{font-size:18px;line-height:1.55;color:#E4E7EA;margin:18px 0 0;max-width:520px}
.cap{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid #2A2E35;font-size:15px}
.bar{height:6px;background:#2A2E35;border-radius:2px;position:relative}
.bar span{position:absolute;left:0;top:0;bottom:0;background:#EF4136;border-radius:2px}
.dotfield{background-color:#0D0D10;background-image:radial-gradient(#2E343C 1.2px,transparent 1.3px);background-size:14px 14px}
.tile{background:#15161B;border:1px solid #2A2E35;border-radius:6px;position:relative;overflow:hidden;box-sizing:border-box}
.note{font-size:14px;line-height:1.5;color:#C9CED3}


.L{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.l1{animation:a1 10s infinite}.l2{animation:a2 10s infinite}.l3{animation:a3 10s infinite}
@keyframes a1{0%,24%{opacity:1}38%,100%{opacity:0}}
@keyframes a2{0%,20%{opacity:0}34%,58%{opacity:1}72%,100%{opacity:0}}
@keyframes a3{0%,54%{opacity:0}70%,92%{opacity:1}100%{opacity:0}}
.ph{position:absolute;left:0;top:0;opacity:0;white-space:nowrap}
.p1{animation:pa 10s infinite}.p2{animation:pb 10s infinite}.p3{animation:pc 10s infinite}
@keyframes pa{0%,24%{opacity:1}34%,100%{opacity:0}}
@keyframes pb{0%,30%{opacity:0}38%,56%{opacity:1}66%,100%{opacity:0}}
@keyframes pc{0%,62%{opacity:0}72%,92%{opacity:1}100%{opacity:0}}
.p3.disp,.disp .p3{white-space:normal;width:560px}
.prog{position:absolute;left:0;top:0;bottom:0;background:#EF4136;animation:pg 10s linear infinite}
@keyframes pg{0%{width:0}100%{width:100%}}
@media (prefers-reduced-motion:reduce){.L,.ph,.prog{animation:none!important}.l1,.l2,.p1,.p2,.p1,.p2{opacity:0}.l3,.p3{opacity:1}.prog{width:100%}}
